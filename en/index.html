<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusHide · Legal</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --card: #ffffff;
      --text: #111111;
      --muted: #6e727a;
      --accent: #0573f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 480px);
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    .lang {
      margin: 0 0 16px;
      text-align: right;
      font-size: 13px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    a {
      display: block;
      padding: 14px 16px;
      margin-top: 10px;
      border-radius: 12px;
      background: rgba(5, 115, 245, 0.08);
      color: var(--accent);
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    a:hover { background: rgba(5, 115, 245, 0.14); }

    .lang a {
      display: inline;
      padding: 0;
      margin: 0;
      background: none;
      font-weight: 400;
    }

    .lang a:hover { background: none; }
  </style>
</head>
<body>
  <main class="card">
    <p class="lang"><a href="../">中文</a> · English · <a href="../ja/">日本語</a></p>
    <h1>FocusHide</h1>
    <p>Legal information and policy pages for App Store review and users.</p>
    <a href="./privacy/">Privacy Policy</a>
    <a href="./terms/">Terms of Use</a>
  </main>
</body>
</html>
