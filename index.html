<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>法律信息</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --card: #ffffff;
      --text: #111111;
      --muted: #6e727a;
      --accent: #0573f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      width: min(100%, 480px);
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 800;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    a {
      display: block;
      padding: 14px 16px;
      margin-top: 10px;
      border-radius: 12px;
      background: rgba(5, 115, 245, 0.08);
      color: var(--accent);
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    a:hover { background: rgba(5, 115, 245, 0.14); }

    h2 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>法律信息</h1>
      <p>各 App 的隐私政策与用户协议，供 App Store 审核与用户查阅。</p>
    </section>
    <section class="card">
      <h2>录音去空白</h2>
      <p>Silence Trimmer</p>
      <a href="./silencetrimmer/privacy/">隐私政策</a>
      <a href="./silencetrimmer/terms/">用户协议</a>
      <a href="./silencetrimmer/en/privacy/">Privacy Policy</a>
      <a href="./silencetrimmer/en/terms/">Terms of Use</a>
    </section>
    <section class="card">
      <h2>试用雷达</h2>
      <p>Trial Radar</p>
      <a href="./trialradar/privacy/">隐私政策</a>
      <a href="./trialradar/terms/">用户协议</a>
      <a href="./trialradar/en/privacy/">Privacy Policy</a>
      <a href="./trialradar/en/terms/">Terms of Use</a>
      <a href="./trialradar/ja/privacy/">プライバシーポリシー</a>
      <a href="./trialradar/ja/terms/">利用規約</a>
      <a href="./trialradar/support/">支持与常见问题 / Support</a>
    </section>
    <section class="card">
      <h2>定时隐藏</h2>
      <p>FocusHide</p>
      <a href="./privacy/">隐私政策</a>
      <a href="./terms/">用户协议</a>
      <a href="./en/privacy/">Privacy Policy</a>
      <a href="./en/terms/">Terms of Use</a>
    </section>
  </main>
</body>
</html>
